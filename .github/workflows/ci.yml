name: CI Pipeline

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            with:
                node-version: 20
            - run: npm ci
            - run: npm install
            - run: npm test